# Consumer Dispatcher (Go) — copy to config.yaml and fill secrets via env.
# Supports ${VAR} and ${VAR:-default} expansion.

defaults:
  url: ${CONSUMER_URL:-http://127.0.0.1:8080/consumerDispatch/dispatch}
  url_host: ""
  count: 1
  timeout_ms: 30000
  encoding: utf-8
  retry_limit: 1
  prefetch: 10
  # declare exchange/queue/dlq on start; set false if topology is managed elsewhere
  declare_topology: true

admin:
  host: "0.0.0.0"
  port: 8888
  # /api/* 需要 "Authorization: Bearer <token>"；每个 token 至少 16 个字符。
  # 未设置的环境变量（空串）会被忽略；一个 token 都没有时 /api/* 不鉴权（启动时打 Warn）。
  # /healthz、/readyz、/metrics 始终免鉴权。
  tokens:
    - ${ADMIN_TOKEN:-}
  # tls:
  #   cert_file: /etc/cd/tls/tls.crt
  #   key_file: /etc/cd/tls/tls.key
  #   # 配置后 /api/* 必须携带此 CA 签发的客户端证书（与 token 同时配置时两者都要满足）
  #   client_ca_file: /etc/cd/tls/client-ca.crt

log:
  level: ${LOG_LEVEL:-info}   # debug | info | warn | error
  # 日志文件；path 为空时只输出到终端（stdout）。按大小自动切割。
  file:
    path: ${LOG_FILE:-}        # 例如 /var/log/consumer-dispatcher/dispatcher.log
    max_size_mb: 100           # 单个文件达到该大小后切割
    max_backups: 10            # 保留的旧文件个数，0 表示不限
    max_age_days: 30           # 旧文件保留天数，0 表示不限
    compress: true             # 旧文件 gzip 压缩
  # 配置了 file.path 时是否同时输出到终端（容器里可打开，方便 kubectl logs）
  stdout: false
  # 消息进入 DLQ 时是否在日志中记录 body（可能含敏感数据，默认关闭）
  failed_body:
    enabled: false
    max_bytes: 512     # 超出部分截断（按 UTF-8 字符边界）
    sample_rate: 1.0   # (0, 1]，只记录这一比例的失败消息

servers:
  site_a:
    host: ${RABBIT_HOST:-127.0.0.1}
    port: ${RABBIT_PORT:-5672}
    username: ${RABBIT_USER:-guest}
    password: ${RABBIT_PASSWORD:-guest}
    vhost: ${RABBIT_VHOST:-/}
    reconnect_seconds: 30
  # site_b:
  #   host: ${RABBIT_HOST_B:-127.0.0.1}
  #   port: 5672
  #   username: ${RABBIT_USER:-guest}
  #   password: ${RABBIT_PASSWORD:-guest}
  #   vhost: /

jobs:
  # server 可写单个名，或列表（其它字段相同，按 server 各起一套消费者）
  # server: site_a
  # server: [site_a, site_b]
  - name: text_mail
    server: site_a
    queue: text_mail
    exchange: text_mail_router
    type: direct
    url: ${CONSUMER_URL:-http://127.0.0.1:8080/consumerDispatch/dispatch}
    url_host: ${CONSUMER_HOST_HEADER:-}
    timeout_ms: 20000
    count: 2
    retry_limit: 3
    prefetch: 5
    # block_patterns: "bad-payload"
    # discard_match_jobs: true
    # dlq: text_mail.dlq

  - name: bounce_mail
    server: site_a
    # queue/exchange/url inherit conventions + defaults
